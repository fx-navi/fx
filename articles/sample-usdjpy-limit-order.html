<h2>指値注文とは</h2>
<p>
  指値注文は「この価格になったら買う（売る）」とあらかじめ予約しておく注文方法です。
  チャートに張り付かなくても、狙った価格でエントリーできます。
</p>

<h2>注文の手順</h2>
<ol>
  <li>売買の方向（買い／売り）を決める</li>
  <li>使う資金とレバレッジを決める</li>
  <li>注文したい価格（指値）を入力する</li>
  <li>損切り価格・利確価格を設定する</li>
</ol>

<h2>損切り・利確の目安</h2>
<p>
  リスクは資金の2%以内に抑えるのが基本です。損切り幅の2倍を利確目標にすると、
  リスクリワード比1:2のトレードになります。
</p>
